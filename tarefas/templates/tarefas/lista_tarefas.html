<html>
<head>
    <title>
        Minhas Tarefas
    </title>
    <style>

body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 20px;
}

h1 {
    color: #333333;
    text-align: center;
}

ul {
    list-style: none;
    padding: 0;
}

li {
    background-color: white;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
}

li form {
    display: inline;
}

button {
    background-color: #3498db;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 5px;
    cursor: pointer;
}

li form:last-of-type button {
    background-color: #e74c3c;
}

input {
    padding: 8px;
    border: 1px solid #cccccc;
    border-radius: 5px;
}

li.feita {
    color: gray;
    text-decoration: line-through;
}

.status {
    display: inline-block;  /* inline-block evita o risco da tarefa feita passar por cima dela */
    font-size: 12px;
    background-color: #eeeeee;
    color: #666666;
    padding: 3px 8px;
    border-radius: 10px;
    margin: 0 10px;
}
    </style>
</head>

<body>
<h1> Minhas Tarefas </h1>

<ul>{% for t in tarefas %}
    <li class="{% if t.concluida %}feita{% endif %}">
        {{ t.tarefa }}
        <span class="status">
            {% if t.concluida %}feita{% else %}pendente{% endif %}
        </span>

        <form method="post" action="{% url 'concluir_tarefa' t.id %}">
            {% csrf_token %}
            <button> Concluir Tarefa </button>
        </form>

        <form method="post" action="{% url 'apagar_tarefa' t.id %}">
            {% csrf_token %}
            <button> Apagar Tarefa </button>
        </form>
    </li>
{% endfor %}</ul>

<form method="post">
{% csrf_token %}
    <input name="tarefa">
    <button>adicionar</button>
</form>
</body>
</html>
